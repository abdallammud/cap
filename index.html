<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b6b4f">
<title>Capture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b4f'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6f5; --card: #ffffff; --ink: #14201b; --muted: #66756e; --line: #dbe3df;
  --accent: #0b6b4f; --accent-ink: #ffffff; --accent-soft: #e2f1ec; --danger: #b3261e;
  --shadow: 0 1px 2px rgba(20,32,27,.06), 0 8px 24px rgba(20,32,27,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1512; --card: #16201c; --ink: #e8f0ec; --muted: #8fa198; --line: #26342e;
    --accent: #2fb58a; --accent-ink: #06231a; --accent-soft: #163a2f; --danger: #ff8a80;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 14px; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
button { font: inherit; color: inherit; cursor: pointer; }
.link { background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 8px; font-size: .88rem; }
.link:hover { color: var(--ink); background: var(--accent-soft); }
.label { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; font-size: .78rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: .92rem; transition: background .12s, border-color .12s, transform .06s; }
.chip:hover { border-color: var(--accent); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .x { display: none; font-weight: 700; opacity: .8; }
.managing .chip .x { display: inline; }
.managing .chip { border-style: dashed; }
.adder { display: none; gap: 8px; margin-bottom: 14px; }
.managing .adder { display: flex; }
input[type=text], input[type=password] { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font: inherit; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { display: block; width: 100%; min-height: 150px; max-height: 55vh; resize: none; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); font: inherit; line-height: 1.5; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
.count { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.btn { border: 0; border-radius: 12px; padding: 13px 22px; background: var(--accent); color: var(--accent-ink); font-weight: 650; min-width: 120px; transition: filter .12s, transform .06s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.small { padding: 10px 16px; min-width: 0; }
.hint { color: var(--muted); font-size: .8rem; margin-top: 10px; }
.recent { margin-top: 18px; }
.recent ul { list-style: none; margin: 0; padding: 0; }
.recent li { display: flex; gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); font-size: .9rem; }
.recent li:first-child { border-top: 0; }
.recent time { color: var(--muted); font-size: .78rem; white-space: nowrap; padding-top: 2px; }
.recent b { color: var(--accent); font-weight: 650; }
.recent span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .9rem; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.3em; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 24px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: .9rem; box-shadow: var(--shadow); transition: opacity .18s, transform .18s; max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast.bad { background: var(--danger); color: #fff; }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Capture</h1>
      <div class="sub">Straight to your second brain</div>
    </div>
    <button class="link" id="lock" type="button" hidden>Lock</button>
  </header>

  <!-- Login -->
  <section class="card" id="login" hidden>
    <form class="field" id="loginForm" autocomplete="on">
      <div class="label"><span>Passphrase</span></div>
      <input type="password" id="pass" placeholder="Your passphrase" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" id="remember" checked> Remember on this device</label>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn" id="loginBtn" type="submit">Unlock</button>
      <div class="hint">On someone else's computer, untick "Remember".</div>
    </form>
  </section>

  <!-- App -->
  <section id="app" hidden>
    <div class="card" id="card">
      <div class="label">
        <span>Project (optional)</span>
        <button class="link" id="manage" type="button">Edit</button>
      </div>
      <div class="chips" id="chips"></div>
      <form class="adder" id="adder" autocomplete="off">
        <input type="text" id="newProject" placeholder="New project name" maxlength="24">
        <button class="btn small" type="submit">Add</button>
      </form>

      <textarea id="note" placeholder="Anything. Do not organize it." maxlength="5000" autofocus></textarea>
      <div class="row">
        <span class="count" id="count">0 / 5000</span>
        <button class="btn" id="save" type="button">Save</button>
      </div>
      <div class="hint">Ctrl or Cmd + Enter also saves.</div>
    </div>

    <div class="recent" id="recentWrap" hidden>
      <div class="label"><span>Saved from this device</span></div>
      <div class="card"><ul id="recent"></ul></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button type="button" id="toastAct" hidden></button></div>

<script>
// Paste the Web app URL from Apps Script (Deploy > Manage deployments). It is safe to be public: the passphrase is the lock.
const API_URL = 'https://script.google.com/macros/s/AKfycbwAXnPdXoDJK-GG8qcf7oWex0ki4W6xF8plvX00g-nKO5yMqz1Ngq4W45BEVDHH7lY/exec';
const DEFAULT_PROJECTS = ['Kaad', 'ERP', 'Remit', 'Chevening', 'Job', 'Family', 'Paper', 'Quran', 'Idea'];
const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9 &_-]{0,23}$/;

const $ = (id) => document.getElementById(id);
let store = null;        // localStorage (remembered) or sessionStorage
let key = '';
let projects = [];
let chosen = '';
let managing = false;
let toastTimer = 0;

function safe(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }
function get(k) { return safe(() => store ? store.getItem(k) : null, null); }
function put(k, v) { safe(() => store && store.setItem(k, v)); }
function del(k) { safe(() => store && store.removeItem(k)); }

function toast(text, opts) {
  opts = opts || {};
  $('toastText').textContent = text;
  $('toast').classList.toggle('bad', !!opts.bad);
  const act = $('toastAct');
  act.hidden = !opts.action;
  act.textContent = opts.action ? opts.action.label : '';
  act.onclick = opts.action ? () => { hideToast(); opts.action.run(); } : null;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opts.action ? 6000 : (opts.bad ? 6000 : 2600));
}
function hideToast() { $('toast').classList.remove('show'); }

async function api(action, data) {
  if (API_URL.indexOf('PASTE_') === 0) throw Object.assign(new Error('API_URL is not set in index.html.'), { code: 'config' });
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // keeps it a simple request, no CORS preflight
      body: JSON.stringify(Object.assign({ action: action, key: key }, data || {}))
    });
  } catch (e) {
    throw Object.assign(new Error('No connection. Your text is still here.'), { code: 'net' });
  }
  let j;
  try { j = await res.json(); } catch (e) { throw Object.assign(new Error('Unexpected reply from the server.'), { code: 'bad' }); }
  if (!j.ok) throw Object.assign(new Error(j.error || 'Failed.'), { code: j.code || 'error' });
  return j;
}

/* ---------- login ---------- */
function showLogin(msg) {
  $('app').hidden = true; $('lock').hidden = true; $('login').hidden = false;
  $('loginErr').textContent = msg || '';
  $('pass').focus();
}
function showApp() {
  $('login').hidden = true; $('app').hidden = false; $('lock').hidden = false;
  renderChips(); renderRecent(); restoreDraft(); grow();
  $('note').focus();
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('loginBtn');
  key = $('pass').value;
  store = $('remember').checked ? window.localStorage : window.sessionStorage;
  btn.disabled = true; btn.textContent = 'Checking...'; $('loginErr').textContent = '';
  try {
    const r = await api('projects.get');
    put('cap.key', key);
    projects = r.projects; put('cap.projects', JSON.stringify(projects));
    $('pass').value = '';
    showApp();
  } catch (err) {
    key = '';
    $('loginErr').textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
});

$('lock').addEventListener('click', () => {
  ['cap.key', 'cap.draft', 'cap.recent'].forEach((k) => { safe(() => localStorage.removeItem(k)); safe(() => sessionStorage.removeItem(k)); });
  key = ''; chosen = ''; $('note').value = '';
  showLogin('Locked.');
});

/* ---------- projects ---------- */
function renderChips() {
  const box = $('chips');
  box.textContent = '';
  projects.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (p === chosen ? ' on' : '');
    b.appendChild(document.createTextNode(p));
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-hidden', 'true');
    b.appendChild(x);
    b.setAttribute('aria-label', managing ? 'Remove ' + p : p);
    b.onclick = () => (managing ? removeProject(p) : (chosen = (chosen === p ? '' : p), renderChips()));
    box.appendChild(b);
  });
  $('card').classList.toggle('managing', managing);
  $('manage').textContent = managing ? 'Done' : 'Edit';
}

async function saveProjects(next, prev) {
  projects = next; renderChips();
  try {
    const r = await api('projects.set', { projects: next });
    projects = r.projects; put('cap.projects', JSON.stringify(projects)); renderChips();
    return true;
  } catch (err) {
    projects = prev; renderChips();
    toast('Could not save the list: ' + err.message, { bad: true });
    return false;
  }
}

function removeProject(p) {
  const prev = projects.slice();
  if (chosen === p) chosen = '';
  saveProjects(projects.filter((x) => x !== p), prev).then((ok) => {
    if (ok) toast('Removed ' + p + '. Old notes keep their label.', { action: { label: 'Undo', run: () => saveProjects(prev, projects.slice()) } });
  });
}

$('manage').addEventListener('click', () => { managing = !managing; renderChips(); if (managing) $('newProject').focus(); });
$('adder').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('newProject').value.trim();
  if (!NAME_RE.test(name)) { toast('Use letters, digits, space, & _ - (max 24).', { bad: true }); return; }
  if (projects.some((p) => p.toLowerCase() === name.toLowerCase())) { toast(name + ' already exists.', { bad: true }); return; }
  $('newProject').value = '';
  saveProjects(projects.concat(name), projects.slice());
});

/* ---------- note ---------- */
function grow() {
  const t = $('note');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight + 2, window.innerHeight * 0.55) + 'px';
  $('count').textContent = t.value.length + ' / 5000';
}
function restoreDraft() { const d = get('cap.draft'); if (d && !$('note').value) $('note').value = d; }
$('note').addEventListener('input', () => { grow(); put('cap.draft', $('note').value); });
$('note').addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(); } });
$('save').addEventListener('click', save);

async function save() {
  const text = $('note').value.trim();
  if (!text) { toast('Write something first.', { bad: true }); return; }
  const btn = $('save');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const r = await api('add', { text: text, project: chosen });
    addRecent({ stamp: r.stamp, project: chosen, text: text });
    toast('Saved' + (chosen ? ' to ' + chosen : '') + ' at ' + r.stamp.slice(11));
    $('note').value = ''; del('cap.draft'); chosen = ''; renderChips(); renderRecent(); grow();
    $('note').focus();
  } catch (err) {
    if (err.code === 'auth') { showLogin('Passphrase no longer valid. Your text is kept.'); }
    else toast('NOT saved: ' + err.message, { bad: true });
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
}

/* ---------- recent (this device only) ---------- */
function loadRecent() { return safe(() => JSON.parse(get('cap.recent') || '[]'), []); }
function addRecent(item) {
  const list = loadRecent();
  list.unshift({ stamp: item.stamp, project: item.project, text: item.text.slice(0, 120) });
  put('cap.recent', JSON.stringify(list.slice(0, 5)));
}
function renderRecent() {
  const list = loadRecent();
  $('recentWrap').hidden = !list.length;
  const ul = $('recent'); ul.textContent = '';
  list.forEach((n) => {
    const li = document.createElement('li');
    const tm = document.createElement('time'); tm.textContent = n.stamp.slice(5, 16).replace('-', '/');
    const t = document.createElement('span'); t.className = 't';
    if (n.project) { const b = document.createElement('b'); b.textContent = n.project + ': '; t.appendChild(b); }
    t.appendChild(document.createTextNode(n.text.replace(/\s+/g, ' ')));
    li.appendChild(tm); li.appendChild(t); ul.appendChild(li);
  });
}

/* ---------- start ---------- */
(async function init() {
  store = safe(() => localStorage.getItem('cap.key') ? localStorage : (sessionStorage.getItem('cap.key') ? sessionStorage : null), null);
  const saved = store ? get('cap.key') : '';
  if (!saved) { store = null; showLogin(); return; }
  key = saved;
  projects = safe(() => JSON.parse(get('cap.projects') || 'null'), null) || DEFAULT_PROJECTS.slice();
  showApp(); // instant, from the cached list
  try {
    const r = await api('projects.get');
    projects = r.projects; put('cap.projects', JSON.stringify(projects)); renderChips();
  } catch (err) {
    if (err.code === 'auth') showLogin('Passphrase changed. Enter the new one.');
    else if (err.code === 'locked' || err.code === 'config') toast(err.message, { bad: true });
  }
})();
window.addEventListener('resize', grow);
</script>
</body>
</html>
